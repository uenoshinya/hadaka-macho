<script>
/**
 * ============================================================
 *  CLOSET CHECK - 画面側の処理
 * ============================================================
 *  ・画面の切り替え、チェック状態の管理、進捗の計算を行います。
 *  ・サーバーとの通信は google.script.run を使います。
 *  ・【XSS 対策】画面に文字を出すときは必ず textContent を使い、
 *    innerHTML は使いません（入力された文字がそのまま表示されるだけで、
 *    HTML として実行されることはありません）。
 * ============================================================
 */
(function () {
  'use strict';

  /* ------------------------------------------------------------
   * 設定：チェック画面の種類
   * ------------------------------------------------------------ */
  var MODES = {
    vintage: {
      title: '古着の状態チェック',
      intro: '明るい場所で、生地・シミ・ダメージ・ニオイを確認しましょう。新品の場合は省略して構いません。',
      targets: ['vintage', 'both'],   // Checklist の target_type のうち、この画面に出すもの
      canExclude: false               // カテゴリーを「対象外」にできるか
    },
    fitting: {
      title: '試着・フィット感チェック',
      intro: '試着して、鏡の前で動きながら確認しましょう。関係のないカテゴリーは「対象外」にできます。',
      targets: ['fitting', 'both'],
      canExclude: true
    }
  };

  var SCREEN_TITLES = {
    loading: '',
    home: '',
    check: '',             // チェック画面はモードごとのタイトルを使う
    judge: '購入判定',
    product: '商品情報の入力',
    saved: '保存完了',
    history: '購入履歴',
    guide: 'アプリの使い方'
  };

  var STATUS_OK = 'ok';
  var STATUS_CONCERN = 'concern';

  /* ------------------------------------------------------------
   * アプリの状態（今どの画面か・何にチェックしたか）
   * ------------------------------------------------------------ */
  var state = {
    data: null,       // サーバーから受け取ったチェック項目と設定
    statuses: {},     // { item_id: 'ok' | 'concern' }  ※未確認は登録しない
    excluded: {},     // { 'fitting|C. パンツのサイズ感': true }  対象外のカテゴリー
    screen: 'loading',
    mode: null,       // 'vintage' | 'fitting'
    judgeFrom: 'home',     // 判定画面の「戻る」で戻る先（'home' か 'check'）
    judgment: null,        // 最後に受け取った判定結果（STEP 5 の保存で使う）
    judgeRequestId: 0,     // 古い判定結果を無視するための番号
    recordId: null,        // 保存用の記録 ID（同じチェックでは同じ ID を使い、二重保存を防ぐ）
    judgmentTouched: false,// 総合判定をユーザーが自分で選んだか
    isSaving: false,       // 保存中フラグ（保存ボタンの連打を防ぐ）
    guideImage: null, // NG例の見本画像（一度読み込んだら使い回す）
    guideImageLoading: false
  };

  var viewerReturnFocus = null; // ビューアーを閉じたときにフォーカスを戻す要素

  var toastTimer = null;

  /* ============================================================
   * 起動
   * ============================================================ */
  document.addEventListener('DOMContentLoaded', function () {
    document.addEventListener('click', onDocumentClick);
    byId('back-button').addEventListener('click', goBack);
    byId('retry-button').addEventListener('click', loadInitialData);
    byId('judge-retry-button').addEventListener('click', runJudgment);
    byId('product-form').addEventListener('submit', onSaveSubmit);
    byId('product-form').addEventListener('input', onFormInput);
    byId('product-form').addEventListener('change', onFormInput);
    byId('viewer-close').addEventListener('click', closeViewer);
    byId('viewer-zoom').addEventListener('click', toggleViewerZoom);
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && !byId('image-viewer').hidden) closeViewer();
    });
    loadInitialData();
  });

  /** サーバーからチェック項目と設定を読み込みます */
  function loadInitialData() {
    showScreen('loading');
    byId('loading-message').textContent = '読み込み中…';
    byId('retry-button').hidden = true;

    google.script.run
      .withSuccessHandler(function (data) {
        state.data = data;
        byId('header-brand').textContent = data.appName;
        buildProductForm();
        // シートの入力ミスがあれば開発者向けに表示（アプリは止めない）
        (data.warnings || []).forEach(function (w) { console.warn('[Checklist] ' + w); });
        if (data.items.length === 0) {
          showToast('チェック項目がありません。スプレッドシートを確認してください。', true);
        }
        showScreen('home');
      })
      .withFailureHandler(function (error) {
        byId('loading-message').textContent =
          '読み込みに失敗しました。通信環境を確認して、もう一度お試しください。\n（' + errorMessage(error) + '）';
        byId('retry-button').hidden = false;
      })
      .getInitialData();
  }

  /* ============================================================
   * 画面の切り替え
   * ============================================================ */

  /**
   * 指定した画面だけを表示します。
   * @param {string} screen 'home' | 'check' | 'judge' | 'history' | 'guide' | 'loading'
   * @param {string=} mode  チェック画面のときの種類
   */
  function showScreen(screen, mode) {
    state.screen = screen;
    if (mode) state.mode = mode;

    var sections = document.querySelectorAll('.screen');
    for (var i = 0; i < sections.length; i++) {
      sections[i].hidden = (sections[i].id !== 'screen-' + screen);
    }

    var title = screen === 'check' ? MODES[state.mode].title : SCREEN_TITLES[screen];
    byId('header-screen').textContent = title;
    byId('back-button').hidden = (screen === 'home' || screen === 'loading');
    byId('check-bar').hidden = (screen !== 'check');

    if (screen === 'home') updateHome();
    if (screen === 'check') renderCheck(state.mode);

    window.scrollTo(0, 0);
  }

  /** ヘッダーの「戻る」ボタン（判定画面からは、来たチェック画面に戻る） */
  function goBack() {
    if (state.screen === 'product') {
      showScreen('judge');
      return;
    }
    if (state.screen === 'judge' && state.judgeFrom === 'check') {
      showScreen('check');
      return;
    }
    showScreen('home');
  }

  /** data-action 属性を持つボタンのクリックをまとめて処理します */
  function onDocumentClick(event) {
    var target = event.target.closest('[data-action]');
    if (!target) return;

    switch (target.getAttribute('data-action')) {
      case 'open-check':
        showScreen('check', target.getAttribute('data-mode'));
        break;
      case 'open-history':
        showScreen('history');
        break;
      case 'open-guide':
        showScreen('guide');
        break;
      case 'open-judge':
        openJudge();
        break;
      case 'back-to-check':
        showScreen('check', state.judgeFrom === 'check' ? state.mode : firstPerformedMode());
        break;
      case 'open-product':
        openProduct();
        break;
      case 'start-new':
        showScreen('home');
        break;
      case 'reset-check':
        resetCheck();
        break;
      case 'open-guide-image':
        openViewer();
        break;
    }
  }

  /* ============================================================
   * ホーム画面
   * ============================================================ */

  /** ホームのカードに、各チェックの進み具合を表示します */
  function updateHome() {
    var hasAny = false;
    Object.keys(MODES).forEach(function (mode) {
      var p = computeProgress(mode);
      var el = document.querySelector('[data-progress-for="' + mode + '"]');
      if (p.done > 0) {
        hasAny = true;
        el.textContent = '進捗 ' + p.percent + '%' + (p.concern > 0 ? '・気になる ' + p.concern + '件' : '');
      } else {
        el.textContent = '';
      }
    });
    byId('home-current').hidden = !hasAny;
  }

  /** チェック内容をすべて消して、新しい商品のチェックを始めます */
  function resetCheck() {
    if (!window.confirm('チェック内容と入力中の商品情報をすべて消去します。よろしいですか？')) return;
    clearCurrentCheck();
    updateHome();
    showToast('チェック内容をリセットしました');
  }

  /** 現在のチェック・判定・商品情報の入力内容を初期状態に戻します */
  function clearCurrentCheck() {
    state.statuses = {};
    state.excluded = {};
    state.judgment = null;
    state.recordId = null;
    state.judgmentTouched = false;
    byId('product-form').reset();
    clearFormErrors();
    updateMemoCount();
  }

  /* ============================================================
   * チェック画面
   * ============================================================ */

  /** この画面に表示する項目（表示順）を返します */
  function itemsFor(mode) {
    var targets = MODES[mode].targets;
    return state.data.items.filter(function (item) {
      return targets.indexOf(item.targetType) !== -1;
    });
  }

  /** 項目をカテゴリーごとにまとめます（表示順は保ったまま） */
  function groupByCategory(items) {
    var groups = [];
    var index = {};
    items.forEach(function (item) {
      if (!(item.category in index)) {
        index[item.category] = groups.length;
        groups.push({ category: item.category, items: [] });
      }
      groups[index[item.category]].items.push(item);
    });
    return groups;
  }

  function excludeKey(mode, category) {
    return mode + '|' + category;
  }

  /** チェック画面を作り直します */
  function renderCheck(mode) {
    byId('check-intro').textContent = MODES[mode].intro;
    byId('guide-image-button').hidden = !state.data.hasGuideImage;

    var container = byId('check-categories');
    container.textContent = ''; // 中身を空にする

    groupByCategory(itemsFor(mode)).forEach(function (group) {
      container.appendChild(buildCategory(mode, group));
    });
    updateProgress();
  }

  /** カテゴリー 1 つ分の要素を作ります */
  function buildCategory(mode, group) {
    var key = excludeKey(mode, group.category);
    var excluded = !!state.excluded[key];

    var section = el('section', { className: 'category' + (excluded ? ' is-excluded' : '') });
    section.setAttribute('data-category', group.category);

    var header = el('div', { className: 'category-header' });
    header.appendChild(el('h2', { className: 'category-title', text: group.category }));
    header.appendChild(el('span', { className: 'category-count' }));

    if (MODES[mode].canExclude) {
      var button = el('button', { className: 'exclude-button', text: excluded ? '対象外を解除' : '対象外にする' });
      button.type = 'button';
      button.setAttribute('aria-pressed', String(excluded));
      button.addEventListener('click', function () { toggleExcluded(mode, group.category, section, button); });
      header.appendChild(button);
    }
    section.appendChild(header);

    var note = el('p', { className: 'category-excluded-note', text: 'このカテゴリーは対象外です（判定に含めません）' });
    note.hidden = !excluded;
    section.appendChild(note);

    var list = el('ul', { className: 'item-list' });
    group.items.forEach(function (item) { list.appendChild(buildItem(item)); });
    section.appendChild(list);
    return section;
  }

  /** チェック項目 1 行分の要素を作ります */
  function buildItem(item) {
    var li = el('li', { className: 'item' });
    li.setAttribute('data-id', item.id);

    // 左側：タップでチェック（問題なし）
    var label = el('label', { className: 'item-main' });
    var checkbox = el('input');
    checkbox.type = 'checkbox';
    checkbox.addEventListener('change', function () {
      setStatus(item.id, checkbox.checked ? STATUS_OK : null);
    });
    var box = el('span', { className: 'item-box' });
    box.setAttribute('aria-hidden', 'true');
    var text = el('span', { className: 'item-text', text: item.name });
    if (item.severity === 'critical') {
      text.appendChild(el('span', { className: 'badge badge-critical', text: '重要' }));
    }
    label.appendChild(checkbox);
    label.appendChild(box);
    label.appendChild(text);

    // 右側：「気になる」ボタン
    var concern = el('button', { className: 'concern-button', text: '気になる' });
    concern.type = 'button';
    concern.addEventListener('click', function () {
      setStatus(item.id, state.statuses[item.id] === STATUS_CONCERN ? null : STATUS_CONCERN);
    });

    li.appendChild(label);
    li.appendChild(concern);
    updateItemView(li, state.statuses[item.id]);
    return li;
  }

  /**
   * 項目の状態を変更します。
   * @param {string} id
   * @param {?string} status 'ok' | 'concern' | null（未確認に戻す）
   */
  function setStatus(id, status) {
    if (status) {
      state.statuses[id] = status;
    } else {
      delete state.statuses[id];
    }
    var li = document.querySelector('#check-categories .item[data-id="' + cssEscape(id) + '"]');
    if (li) updateItemView(li, status);
    updateProgress();
  }

  /** 項目 1 行の見た目を状態に合わせます */
  function updateItemView(li, status) {
    var checkbox = li.querySelector('input');
    var box = li.querySelector('.item-box');
    var concern = li.querySelector('.concern-button');

    li.classList.toggle('is-ok', status === STATUS_OK);
    li.classList.toggle('is-concern', status === STATUS_CONCERN);
    checkbox.checked = (status === STATUS_OK);
    box.textContent = status === STATUS_OK ? '✓' : (status === STATUS_CONCERN ? '!' : '');
    concern.setAttribute('aria-pressed', String(status === STATUS_CONCERN));
  }

  /** カテゴリーの「対象外」を切り替えます */
  function toggleExcluded(mode, category, section, button) {
    var key = excludeKey(mode, category);
    var excluded = !state.excluded[key];
    if (excluded) {
      state.excluded[key] = true;
    } else {
      delete state.excluded[key];
    }
    section.classList.toggle('is-excluded', excluded);
    section.querySelector('.category-excluded-note').hidden = !excluded;
    button.textContent = excluded ? '対象外を解除' : '対象外にする';
    button.setAttribute('aria-pressed', String(excluded));
    updateProgress();
  }

  /* ============================================================
   * 進捗の計算と表示
   * ============================================================ */

  /**
   * 進捗を計算します（対象外のカテゴリーは除く）。
   * @return {{total:number, done:number, concern:number, percent:number}}
   */
  function computeProgress(mode, category) {
    var result = { total: 0, done: 0, concern: 0, percent: 0 };
    if (!state.data) return result;

    itemsFor(mode).forEach(function (item) {
      if (category && item.category !== category) return;
      if (state.excluded[excludeKey(mode, item.category)]) return;
      result.total++;
      var s = state.statuses[item.id];
      if (s) result.done++;
      if (s === STATUS_CONCERN) result.concern++;
    });
    result.percent = result.total === 0 ? 0 : Math.round(result.done / result.total * 100);
    return result;
  }

  /** 下部バーとカテゴリー見出しの進捗表示を更新します */
  function updateProgress() {
    var mode = state.mode;
    var p = computeProgress(mode);

    byId('bar-percent').textContent = p.percent + '%';
    byId('bar-fill').style.width = p.percent + '%';
    byId('bar-progress').setAttribute('aria-valuenow', String(p.percent));

    var detail = byId('bar-detail');
    detail.textContent = p.done + ' / ' + p.total + ' 項目' + (p.concern > 0 ? '・気になる ' + p.concern : '');
    detail.classList.toggle('has-concern', p.concern > 0);

    var sections = document.querySelectorAll('#check-categories .category');
    for (var i = 0; i < sections.length; i++) {
      var category = sections[i].getAttribute('data-category');
      var cp = computeProgress(mode, category);
      var excluded = !!state.excluded[excludeKey(mode, category)];
      sections[i].querySelector('.category-count').textContent =
        excluded ? '' : (cp.done + ' / ' + cp.total);
    }
  }

  /* ============================================================
   * 購入判定画面
   *   判定の計算はサーバー（Code.gs の judgeChecks_）だけで行います。
   *   画面側と二重に持たないことで、ルールの食い違いを防ぎます。
   * ============================================================ */

  var VERDICTS = {
    '買い': { en: 'BUY', message: '状態・サイズに大きな問題は見つかりませんでした。' },
    '要検討': { en: 'CONSIDER', message: '気になる点があります。理由を確認して、納得できるか考えましょう。' },
    '見送り': { en: 'PASS', message: '重大な問題が見つかりました。購入は慎重に判断しましょう。' }
  };

  /** 判定画面を開きます */
  function openJudge() {
    if (Object.keys(state.statuses).length === 0) {
      showToast('まだチェックした項目がありません。先にチェックを行ってください。', true);
      return;
    }
    state.judgeFrom = state.screen === 'check' ? 'check' : 'home';
    showScreen('judge');
    runJudgment();
  }

  /** サーバーに判定を依頼します */
  function runJudgment() {
    var requestId = ++state.judgeRequestId;
    byId('judge-result').hidden = true;
    byId('judge-retry').hidden = true;
    byId('judge-message').hidden = false;
    byId('judge-message').textContent = '判定中…';

    google.script.run
      .withSuccessHandler(function (result) {
        // 判定中に別の画面へ移った・再判定した場合は、古い結果を表示しない
        if (requestId !== state.judgeRequestId || state.screen !== 'judge') return;
        state.judgment = result;
        renderJudgment(result);
      })
      .withFailureHandler(function (error) {
        if (requestId !== state.judgeRequestId || state.screen !== 'judge') return;
        byId('judge-message').textContent =
          '判定できませんでした。通信環境を確認して、もう一度お試しください。\n（' + errorMessage(error) + '）';
        byId('judge-retry').hidden = false;
      })
      .evaluateCheck({ statuses: state.statuses, excluded: Object.keys(state.excluded) });
  }

  /** 判定結果を表示します */
  function renderJudgment(result) {
    byId('judge-message').hidden = true;
    byId('judge-result').hidden = false;

    // 総合判定
    var verdict = VERDICTS[result.overall] || { en: '', message: 'チェックした項目がありません。' };
    byId('verdict').setAttribute('data-result', result.overall);
    byId('verdict-text').textContent = result.overall;
    byId('verdict-en').textContent = verdict.en;
    byId('verdict-message').textContent = verdict.message;

    // チェックごとの判定
    var modeBox = byId('mode-results');
    modeBox.textContent = '';
    Object.keys(MODES).forEach(function (mode) {
      var m = result.modes[mode];
      var row = el('button', { className: 'mode-result' });
      row.type = 'button';
      row.setAttribute('data-action', 'open-check');
      row.setAttribute('data-mode', mode);

      var pill = el('span', { className: 'pill', text: m.result });
      pill.setAttribute('data-result', m.result);
      var body = el('span', { className: 'mode-result-body' });
      body.appendChild(el('span', { className: 'mode-result-label', text: MODES[mode].title }));
      body.appendChild(el('span', {
        className: 'mode-result-detail',
        text: m.done === 0
          ? 'まだチェックしていません'
          : '確認 ' + m.done + ' / ' + m.total + ' 項目・気になる ' + m.concernCount + ' 件'
      }));
      row.appendChild(pill);
      row.appendChild(body);
      row.appendChild(el('span', { className: 'mode-result-arrow', text: '›' }));
      modeBox.appendChild(row);
    });

    // 判定の理由
    var list = byId('reason-list');
    list.textContent = '';
    if (result.reasons.length === 0) {
      list.appendChild(el('li', { className: 'reason reason-none', text: '気になる点は見つかりませんでした。' }));
    }
    result.reasons.forEach(function (reason) {
      list.appendChild(el('li', { className: 'reason reason-' + reason.level, text: reason.text }));
    });
  }

  /** チェック済みの項目がある最初のチェック画面（判定画面から戻るとき用） */
  function firstPerformedMode() {
    var modes = Object.keys(MODES);
    for (var i = 0; i < modes.length; i++) {
      if (computeProgress(modes[i]).done > 0) return modes[i];
    }
    return modes[0];
  }

  /* ============================================================
   * 商品情報の入力と保存
   * ============================================================ */

  /** 選択肢（カテゴリー・古着/新品・総合判定）を設定に合わせて作ります（起動時に 1 回） */
  function buildProductForm() {
    var data = state.data;

    var select = byId('f-category');
    select.textContent = '';
    var placeholder = el('option', { text: '選択してください' });
    placeholder.value = '';
    select.appendChild(placeholder);
    data.settings.CATEGORY_OPTIONS.forEach(function (name) {
      var option = el('option', { text: name });
      option.value = name;
      select.appendChild(option);
    });

    buildChoices('f-conditionType', 'conditionType', data.conditionTypes);
    buildChoices('f-judgment', 'judgment', data.judgments);

    // 文字数の上限はサーバーの設定（CONFIG.LIMITS）に合わせる
    byId('f-name').maxLength = data.limits.PRODUCT_NAME;
    byId('f-brand').maxLength = data.limits.BRAND;
    byId('f-memo').maxLength = data.limits.MEMO;
    byId('memo-max').textContent = String(data.limits.MEMO);
  }

  /** ボタン風のラジオボタンを作ります */
  function buildChoices(containerId, name, values) {
    var box = byId(containerId);
    box.textContent = '';
    values.forEach(function (value) {
      var label = el('label', { className: 'choice' });
      var input = el('input');
      input.type = 'radio';
      input.name = name;
      input.value = value;
      label.appendChild(input);
      label.appendChild(el('span', { text: value }));
      box.appendChild(label);
    });
  }

  /** 商品情報の入力画面を開きます（判定画面の「商品情報を入力して保存」） */
  function openProduct() {
    if (!state.judgment) {
      showToast('先に判定を行ってください。', true);
      return;
    }
    // 記録 ID は 1 回のチェックにつき 1 つ（保存に失敗して再送しても二重登録にならない）
    if (!state.recordId) state.recordId = newRecordId();

    // 古着 / 新品：未選択なら、古着チェックをしたかどうかで初期値を決める
    if (!radioValue('conditionType')) {
      setRadio('conditionType', computeProgress('vintage').done > 0 ? '古着' : '新品');
    }
    // 総合判定：自分で選んでいなければ、参考判定を初期値にする
    if (!state.judgmentTouched) {
      setRadio('judgment', state.judgment.overall);
    }
    byId('product-hint').textContent =
      '参考判定は「' + state.judgment.overall + '」です。商品の情報を入力して保存しましょう。';
    byId('form-error').hidden = true;
    showScreen('product');
  }

  /** 入力中にエラー表示を消し、メモの文字数を更新します */
  function onFormInput(event) {
    var target = event.target;
    if (target.name === 'judgment') state.judgmentTouched = true;
    var field = target.name || (target.id || '').replace(/^f-/, '');
    setFieldError(field, '');
    if (target.id === 'f-memo') updateMemoCount();
  }

  function updateMemoCount() {
    byId('memo-count').textContent = String(byId('f-memo').value.length);
  }

  /**
   * 入力値を検証します（サーバー側でも同じ内容を必ず再確認します）。
   * @return {{values: Object, errors: Object}} errors は { 項目名: メッセージ }
   */
  function validateProductForm() {
    var limits = state.data.limits;
    var priceMax = state.data.settings.PRICE_MAX;
    var values = {
      name: byId('f-name').value.trim(),
      brand: byId('f-brand').value.trim(),
      category: byId('f-category').value,
      conditionType: radioValue('conditionType'),
      price: toHalfWidth(byId('f-price').value).replace(/[,，円\s]/g, ''),
      memo: byId('f-memo').value.trim(),
      judgment: radioValue('judgment')
    };
    var errors = {};

    if (values.name === '') errors.name = '商品名を入力してください';
    else if (values.name.length > limits.PRODUCT_NAME) errors.name = limits.PRODUCT_NAME + ' 文字以内で入力してください';
    if (values.brand.length > limits.BRAND) errors.brand = limits.BRAND + ' 文字以内で入力してください';
    if (values.category === '') errors.category = 'カテゴリーを選んでください';
    if (!values.conditionType) errors.conditionType = '古着か新品かを選んでください';
    if (values.price === '') errors.price = '価格を入力してください';
    else if (!/^\d+$/.test(values.price) || Number(values.price) > priceMax) {
      errors.price = '0〜' + priceMax.toLocaleString() + ' 円の整数で入力してください';
    }
    if (values.memo.length > limits.MEMO) errors.memo = limits.MEMO + ' 文字以内で入力してください';
    if (!values.judgment) errors.judgment = '総合判定を選んでください';

    return { values: values, errors: errors };
  }

  /** 「この内容で保存」 */
  function onSaveSubmit(event) {
    event.preventDefault(); // ページ移動を止める（google.script.run で送信する）
    if (state.isSaving) return; // 保存中の連打を無視（二重保存の防止）

    clearFormErrors();
    var check = validateProductForm();
    var fields = Object.keys(check.errors);
    if (fields.length > 0) {
      fields.forEach(function (field) { setFieldError(field, check.errors[field]); });
      focusField(fields[0]);
      showToast('入力内容を確認してください', true);
      return;
    }

    setSaving(true);
    google.script.run
      .withSuccessHandler(function (result) {
        setSaving(false);
        showSaved(check.values, result);
      })
      .withFailureHandler(function (error) {
        setSaving(false);
        var box = byId('form-error');
        box.textContent = '保存できませんでした。入力内容はそのまま残っています。\n' + errorMessage(error);
        box.hidden = false;
        showToast('保存できませんでした', true);
      })
      .saveRecord({
        recordId: state.recordId,
        product: check.values,
        statuses: state.statuses,
        excluded: Object.keys(state.excluded)
      });
  }

  /** 保存中はボタンを押せなくし、表示を変えます */
  function setSaving(saving) {
    state.isSaving = saving;
    var button = byId('save-button');
    button.disabled = saving;
    button.textContent = saving ? '保存中…' : 'この内容で保存';
  }

  /** 保存完了画面を表示し、次のチェックに備えて入力内容を消します */
  function showSaved(values, result) {
    byId('saved-name').textContent = values.name;
    byId('saved-judgment').textContent = result.judgment +
      (result.autoJudgment && result.autoJudgment !== result.judgment ? '（参考判定：' + result.autoJudgment + '）' : '');
    byId('saved-date').textContent = result.createdAt;
    clearCurrentCheck();
    showScreen('saved');
    showToast(result.duplicated ? 'この記録は保存済みです' : '保存しました');
  }

  function setFieldError(field, message) {
    var errorEl = byId('e-' + field);
    var input = byId('f-' + field);
    if (!errorEl || !input) return;
    errorEl.textContent = message;
    input.classList.toggle('is-invalid', message !== '');
  }

  function clearFormErrors() {
    ['name', 'brand', 'category', 'conditionType', 'price', 'memo', 'judgment']
      .forEach(function (field) { setFieldError(field, ''); });
    byId('form-error').hidden = true;
  }

  /** エラーのある項目までスクロールし、入力できるようにします */
  function focusField(field) {
    var input = byId('f-' + field);
    if (!input) return;
    var target = input.querySelector('input') || input;
    target.focus();
    input.scrollIntoView({ block: 'center' });
  }

  function radioValue(name) {
    var checked = document.querySelector('input[name="' + name + '"]:checked');
    return checked ? checked.value : '';
  }

  function setRadio(name, value) {
    var inputs = document.querySelectorAll('input[name="' + name + '"]');
    for (var i = 0; i < inputs.length; i++) inputs[i].checked = (inputs[i].value === value);
  }

  /** 全角数字を半角にします（価格入力用） */
  function toHalfWidth(text) {
    return String(text).replace(/[０-９]/g, function (c) {
      return String.fromCharCode(c.charCodeAt(0) - 0xFEE0);
    });
  }

  /** 記録 ID を作ります。例）CC-20261106-k3x9a0qz */
  function newRecordId() {
    var now = new Date();
    var ymd = String(now.getFullYear()) + pad2(now.getMonth() + 1) + pad2(now.getDate());
    var chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
    var random = '';
    var bytes = new Uint8Array(8);
    (window.crypto || window.msCrypto).getRandomValues(bytes);
    for (var i = 0; i < bytes.length; i++) random += chars.charAt(bytes[i] % chars.length);
    return 'CC-' + ymd + '-' + random;
  }

  function pad2(n) {
    return (n < 10 ? '0' : '') + n;
  }

  /* ============================================================
   * NG例の見本ビューアー
   *   画像は 1 枚（左半分：古着の状態／右半分：試着）。
   *   スマホでは今のチェック画面に合う半分を画面幅に合わせて表示し、
   *   横スクロールでもう半分、「拡大」で文字を読める大きさにできます。
   * ============================================================ */

  function openViewer() {
    viewerReturnFocus = document.activeElement;
    byId('image-viewer').classList.remove('is-zoomed');
    byId('viewer-zoom').setAttribute('aria-pressed', 'false');
    byId('viewer-zoom').textContent = '拡大';
    byId('image-viewer').hidden = false;
    document.body.classList.add('is-viewer-open');
    byId('viewer-close').focus();

    if (state.guideImage) {
      showViewerImage();
      return;
    }
    loadGuideImage();
  }

  /** サーバーから見本画像を読み込みます（初回のみ） */
  function loadGuideImage() {
    if (state.guideImageLoading) return;
    state.guideImageLoading = true;
    byId('viewer-image').hidden = true;
    byId('viewer-message').textContent = '画像を読み込み中…';

    google.script.run
      .withSuccessHandler(function (dataUrl) {
        state.guideImageLoading = false;
        state.guideImage = dataUrl;
        if (!byId('image-viewer').hidden) showViewerImage();
      })
      .withFailureHandler(function (error) {
        state.guideImageLoading = false;
        byId('viewer-message').textContent =
          '画像を読み込めませんでした。\n' + errorMessage(error) + '\n\n閉じてから、もう一度お試しください。';
      })
      .getGuideImage();
  }

  /** 画像を表示し、今のチェック画面に合う側へスクロールします */
  function showViewerImage() {
    var img = byId('viewer-image');
    byId('viewer-message').textContent = '';
    img.hidden = false;

    var scrollToSide = function () {
      var box = byId('viewer-scroll');
      box.scrollTop = 0;
      // 試着チェック画面なら右半分、それ以外は左半分から表示
      box.scrollLeft = state.screen === 'check' && state.mode === 'fitting' ? box.scrollWidth : 0;
    };
    if (img.getAttribute('src') === state.guideImage && img.complete) {
      scrollToSide();
    } else {
      img.onload = scrollToSide;
      img.src = state.guideImage; // data URL なので HTML として解釈されることはない
    }
  }

  /** 「拡大」ボタン：表示中の場所を中心にしたまま、2 倍に拡大・縮小します */
  function toggleViewerZoom() {
    var viewer = byId('image-viewer');
    var box = byId('viewer-scroll');
    var centerX = (box.scrollLeft + box.clientWidth / 2) / box.scrollWidth;
    var centerY = (box.scrollTop + box.clientHeight / 2) / box.scrollHeight;

    var zoomed = viewer.classList.toggle('is-zoomed');
    byId('viewer-zoom').setAttribute('aria-pressed', String(zoomed));
    byId('viewer-zoom').textContent = zoomed ? '縮小' : '拡大';

    box.scrollLeft = centerX * box.scrollWidth - box.clientWidth / 2;
    box.scrollTop = centerY * box.scrollHeight - box.clientHeight / 2;
  }

  function closeViewer() {
    byId('image-viewer').hidden = true;
    document.body.classList.remove('is-viewer-open');
    if (viewerReturnFocus && viewerReturnFocus.focus) viewerReturnFocus.focus();
  }

  /* ============================================================
   * お知らせ表示（トースト）
   * ============================================================ */

  /**
   * 画面下部に短いメッセージを表示します。
   * @param {string} message
   * @param {boolean=} isError true ならワインレッドで表示（長めに表示）
   */
  function showToast(message, isError) {
    var toast = byId('toast');
    toast.textContent = message;
    toast.classList.toggle('is-error', !!isError);
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.hidden = true; }, isError ? 5000 : 3000);
  }

  /* ============================================================
   * 小さな道具
   * ============================================================ */

  function byId(id) {
    return document.getElementById(id);
  }

  /**
   * 要素を作ります。文字は必ず textContent で入れます（XSS 対策）。
   * @param {string} tag
   * @param {{className?: string, text?: string}=} options
   */
  function el(tag, options) {
    var node = document.createElement(tag);
    if (options && options.className) node.className = options.className;
    if (options && options.text != null) node.textContent = options.text;
    return node;
  }

  /** querySelector で使うために特殊文字をエスケープします */
  function cssEscape(value) {
    return window.CSS && CSS.escape ? CSS.escape(value) : String(value).replace(/["\\]/g, '\\$&');
  }

  /** google.script.run の失敗内容を、表示用の文字列にします */
  function errorMessage(error) {
    if (!error) return '不明なエラー';
    return error.message ? error.message : String(error);
  }
})();
</script>
